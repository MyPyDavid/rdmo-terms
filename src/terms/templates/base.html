<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="icon" href="{{ base_url }}static/img/favicon.png">
        <title>RDMO terms</title>

        <link href="{{ base_url }}static/vendor/bootstrap.min.css" rel="stylesheet" />
        <link href="{{ base_url }}static/css/style.css" rel="stylesheet" />

        <script src="{{ base_url }}static/vendor/bootstrap.bundle.min.js"></script>
        <script src="{{ base_url }}static/vendor/minisearch.min.js"></script>
        <script src="{{ base_url }}static/js/app.js"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="{{ base_url }}">RDMO terms</a>
                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ base_url }}questions/">Questions</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ base_url }}domain/">Domain</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ base_url }}options/">Options</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ base_url }}conditions/">Conditions</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ base_url }}tasks/">Tasks</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ base_url }}views/">Views</a>
                        </li>
                    </ul>

                    <form class="d-flex" role="search">
                        <input class="form-control" type="search" id="search" placeholder="Search" />
                    </form>
                </div>
            </div>
        </nav>

        <main>
            <div class="container py-5">
                {% block content %}
                {% endblock %}
            </div>
        </main>
  </body>
</html>
